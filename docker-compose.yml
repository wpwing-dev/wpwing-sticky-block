name: wpwing-sticky-block

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wordpress}
      MYSQL_USER: ${MYSQL_USER:-wordpress}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 10

  wordpress:
    image: wordpress:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: ${MYSQL_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG', true);
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('FORCE_SSL_ADMIN', true);
        define('WP_HOME', 'https://sticky-block.local');
        define('WP_SITEURL', 'https://sticky-block.local');
        if ( isset( $$_SERVER['HTTP_X_FORWARDED_PROTO'] ) && 'https' === $$_SERVER['HTTP_X_FORWARDED_PROTO'] ) {
            $$_SERVER['HTTPS'] = 'on';
        }
    volumes:
      - ./src:/var/www/html/wp-content/plugins/wpwing-sticky-block/src
      - ./build:/var/www/html/wp-content/plugins/wpwing-sticky-block/build
      - ./docs:/var/www/html/wp-content/plugins/wpwing-sticky-block/docs
      - ./wpwing-sticky-block.php:/var/www/html/wp-content/plugins/wpwing-sticky-block/wpwing-sticky-block.php
      - wp_data:/var/www/html
    networks:
      default:
      proxy:
        aliases:
          - sticky-wordpress
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost/wp-login.php"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  wpcli:
    image: wordpress:cli
    user: root
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_healthy
    volumes:
      - ./src:/var/www/html/wp-content/plugins/wpwing-sticky-block/src
      - ./build:/var/www/html/wp-content/plugins/wpwing-sticky-block/build
      - ./docs:/var/www/html/wp-content/plugins/wpwing-sticky-block/docs
      - ./wpwing-sticky-block.php:/var/www/html/wp-content/plugins/wpwing-sticky-block/wpwing-sticky-block.php
      - ./docker/wordpress:/docker/wordpress:ro
      - wp_data:/var/www/html
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: ${MYSQL_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress}
    command: sh /docker/wordpress/setup.sh

  caddy:
    image: caddy:2-alpine
    depends_on:
      wordpress:
        condition: service_healthy
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - proxy

volumes:
  db_data:
  wp_data:
  caddy_data:
  caddy_config:

networks:
  proxy:
    name: wpwing-proxy
    external: true
